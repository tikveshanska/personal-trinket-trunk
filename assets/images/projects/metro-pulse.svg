<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <!-- Card Background -->
  <rect width="400" height="250" fill="#EDE6CE"/>
  
  <!-- Grid lines -->
  <line x1="20" y1="50" x2="380" y2="50" stroke="#D9D5C8" stroke-width="1"/>
  <line x1="20" y1="100" x2="380" y2="100" stroke="#D9D5C8" stroke-width="1"/>
  <line x1="20" y1="150" x2="380" y2="150" stroke="#D9D5C8" stroke-width="1"/>
  <line x1="20" y1="200" x2="380" y2="200" stroke="#D9D5C8" stroke-width="1"/>

  <!-- Outer frame border -->
  <rect x="15" y="15" width="370" height="220" fill="none" stroke="#16172B" stroke-width="1.5"/>

  <!-- Transit Map & Mobile Phone Frame -->
  <g transform="translate(60, 30)">
    <rect x="6" y="6" width="130" height="180" rx="14" fill="#16172B" opacity="0.15"/>
    <rect width="130" height="180" rx="14" fill="#16172B" stroke="#16172B" stroke-width="1.5"/>
    <rect x="5" y="12" width="120" height="156" rx="6" fill="#FAF6EE"/>
    
    <!-- Phone Screen UI -->
    <rect x="12" y="20" width="106" height="18" rx="2" fill="#E4E1D8"/>
    <text x="18" y="32" font-family="'Space Mono', monospace" font-size="6.5" font-weight="bold" fill="#16172B">OFFLINE MODE [ON]</text>
    
    <!-- Transit lines diagram -->
    <path d="M20 70H110" stroke="#EE5B5B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="35" cy="70" r="4" fill="#FAF6EE" stroke="#16172B" stroke-width="2"/>
    <circle cx="70" cy="70" r="4" fill="#FAF6EE" stroke="#16172B" stroke-width="2"/>
    <circle cx="100" cy="70" r="4" fill="#FAF6EE" stroke="#16172B" stroke-width="2"/>
    
    <path d="M70 50V110" stroke="#2D7DA8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="70" cy="95" r="4" fill="#FAF6EE" stroke="#16172B" stroke-width="2"/>

    <rect x="12" y="125" width="106" height="34" rx="2" fill="#EDE6CE" stroke="#16172B" stroke-width="1"/>
    <text x="18" y="137" font-family="'Space Mono', monospace" font-size="6" font-weight="bold" fill="#16172B">NEXT DEPARTURE</text>
    <text x="18" y="151" font-family="'Space Mono', monospace" font-size="9" font-weight="bold" fill="#C1493B">Line 2 • 3 MIN</text>
  </g>

  <!-- Spec Sheet Panel on Right -->
  <g transform="translate(205, 30)">
    <rect width="145" height="180" rx="3" fill="#FAF6EE" stroke="#16172B" stroke-width="1.5"/>
    <rect width="145" height="24" rx="2" fill="#E4E1D8" stroke="#16172B" stroke-width="1.5"/>
    <text x="12" y="16" font-family="'Space Mono', monospace" font-size="8" font-weight="bold" fill="#16172B">PERF BUDGET</text>
    
    <text x="12" y="44" font-family="'Space Mono', monospace" font-size="7" fill="#888796">TOTAL BUNDLE</text>
    <text x="12" y="60" font-family="'Space Mono', monospace" font-size="12" font-weight="bold" fill="#16172B">114 KB</text>
    <text x="12" y="72" font-family="'Space Mono', monospace" font-size="6.5" fill="#6FAFB6">&lt; 150kb target budget</text>

    <line x1="12" y1="84" x2="133" y2="84" stroke="#D9D5C8" stroke-width="1"/>

    <text x="12" y="104" font-family="'Space Mono', monospace" font-size="7" fill="#888796">OFFLINE LATENCY</text>
    <text x="12" y="120" font-family="'Space Mono', monospace" font-size="12" font-weight="bold" fill="#2D7DA8">35 ms</text>
    <text x="12" y="132" font-family="'Space Mono', monospace" font-size="6.5" fill="#16172B">IndexedDB + SW Cache</text>

    <rect x="12" y="145" width="121" height="22" rx="2" fill="#6FAFB6" stroke="#16172B" stroke-width="1"/>
    <text x="72" y="159" font-family="'Space Mono', monospace" font-size="7" font-weight="bold" fill="#16172B" text-anchor="middle">ZERO CELL DEPENDENCY</text>
  </g>
</svg>
