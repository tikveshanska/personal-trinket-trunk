    <text x="24" y="52" font-family="'Space Mono', monospace" font-size="7" fill="#16172B">MONTHLY SEATS AUDITED</text>
    <text x="24" y="74" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="#16172B">$1,420</text>
    <text x="85" y="72" font-family="'Space Mono', monospace" font-size="8" fill="#C1493B">SAVED/MO</text>

    <!-- Table snippet -->
    <rect x="156" y="38" width="128" height="115" rx="2" fill="#FFFFFF" stroke="#16172B" stroke-width="1"/>
    <rect x="156" y="38" width="128" height="18" fill="#E4E1D8"/>
    <text x="164" y="50" font-family="'Space Mono', monospace" font-size="6.5" font-weight="bold" fill="#16172B">ORPHAN SEATS</text>
    <text x="250" y="50" font-family="'Space Mono', monospace" font-size="6.5" font-weight="bold" fill="#C1493B">ACTION</text>
    
    <text x="164" y="72" font-family="'Space Mono', monospace" font-size="6.5" fill="#16172B">Figma Pro (4)</text>
    <rect x="246" y="63" width="30" height="11" rx="1" fill="#C1493B"/>
    <text x="261" y="71" font-family="'Space Mono', monospace" font-size="5" fill="#FAF6EE" text-anchor="middle">REVOKE</text>

    <text x="164" y="94" font-family="'Space Mono', monospace" font-size="6.5" fill="#16172B">Notion AI (12)</text>
    <rect x="246" y="85" width="30" height="11" rx="1" fill="#C1493B"/>
    <text x="261" y="93" font-family="'Space Mono', monospace" font-size="5" fill="#FAF6EE" text-anchor="middle">REVOKE</text>

    <text x="164" y="116" font-family="'Space Mono', monospace" font-size="6.5" fill="#16172B">Datadog APM</text>
    <rect x="246" y="107" width="30" height="11" rx="1" fill="#6FAFB6"/>
    <text x="261" y="115" font-family="'Space Mono', monospace" font-size="5" fill="#FAF6EE" text-anchor="middle">KEEP</text>

    <rect x="16" y="100" width="128" height="53" rx="2" fill="#F2EAD8" stroke="#16172B" stroke-width="1"/>
    <text x="24" y="116" font-family="'Space Mono', monospace" font-size="7" font-weight="bold" fill="#16172B">TIME-TO-DISCOVERY</text>
    <text x="24" y="138" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#2D7DA8">4h -> 9m</text>
